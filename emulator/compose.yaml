services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emulator
      POSTGRES_USER: emulator
      POSTGRES_PASSWORD: emulator-local
    volumes:
      - emulator-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulator -d emulator"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 0.25
    mem_limit: 256m
  emulator:
    build: .
    environment:
      EMULATOR_DB_URL: jdbc:postgresql://postgres:5432/emulator
      EMULATOR_DB_USER: emulator
      EMULATOR_DB_PASSWORD: emulator-local
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 512m
volumes:
  emulator-db:
