        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '500':
          "$ref": "#/components/responses/Error500"
      parameters:
      - name: type
        in: query
        schema:
          "$ref": "#/components/schemas/Type"
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      description: Sorted by descending ID. Initiators see their own tasks; operators
        see their service tasks.
    post:
      operationId: createTask
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
          headers:
            X-CSRF-TOKEN:
              schema:
                type: string
              description: Session CSRF token; resend as X-CSRF-TOKEN on mutations.
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '500':
          "$ref": "#/components/responses/Error500"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Create"
