              schema:
                type: string
              description: Session CSRF token; resend as X-CSRF-TOKEN on mutations.
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '500':
          "$ref": "#/components/responses/Error500"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Edit"
      description: Save after RETURNED restores the previous operator even when fields
        are unchanged.
  "/api/tasks/{id}/worker":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    put:
