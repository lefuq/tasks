  "/api/tasks/{id}/result/file":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      operationId: downloadFile
      responses:
        '200':
          description: Attachment task-{id}.md. Empty fail file is supported.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
            X-CSRF-TOKEN:
              schema:
                type: string
              description: Session CSRF token; resend as X-CSRF-TOKEN on mutations.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
