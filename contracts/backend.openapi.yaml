---
openapi: 3.0.3
info:
  title: Exchange backend API
  version: 1.0.0
  description: Local same-origin HTTP session, HttpOnly SameSite=Strict SESSION cookie
    and synchronizer CSRF token. UTC timestamps. Public external emulator DTOs use
    processing_time; application Result DTO uses processingTime. No callback endpoints.
servers:
- url: http://localhost:8080
security:
- session: []
paths:
  "/api/session":
    post:
      operationId: login
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Actor"
          headers:
            X-CSRF-TOKEN:
              schema:
                type: string
              description: Session CSRF token; resend as X-CSRF-TOKEN on mutations.
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '500':
          "$ref": "#/components/responses/Error500"
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Login"
      security: []
    delete:
      operationId: logout
      responses:
        '204':
          description: No content
          headers:
            X-CSRF-TOKEN:
              schema:
                type: string
              description: Session CSRF token; resend as X-CSRF-TOKEN on mutations.
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '500':
          "$ref": "#/components/responses/Error500"
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
  "/api/me":
    get:
      operationId: me
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Actor"
          headers:
            X-CSRF-TOKEN:
              schema:
                type: string
              description: Session CSRF token; resend as X-CSRF-TOKEN on mutations.
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '500':
          "$ref": "#/components/responses/Error500"
      description: Call before login to obtain X-CSRF-TOKEN and SESSION cookie. Successful
        login rotates the session ID. Sessions are persisted in PostgreSQL and expire
        after 30 idle minutes.
      security: []
  "/api/workers":
    get:
      operationId: workers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
